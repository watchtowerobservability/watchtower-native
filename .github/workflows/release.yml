name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: bash
        run: |
          cmake --install build --config Release --prefix "watchtower-native-${GITHUB_REF_NAME}-${{ runner.os }}"
          tar -czf "watchtower-native-${GITHUB_REF_NAME}-${{ runner.os }}.tar.gz" "watchtower-native-${GITHUB_REF_NAME}-${{ runner.os }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ runner.os }}
          path: watchtower-native-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pkg-*
          merge-multiple: true
      - name: Source archive
        run: git archive --format=tar.gz --prefix="watchtower-native-${GITHUB_REF_NAME}/" -o "dist/watchtower-native-${GITHUB_REF_NAME}-src.tar.gz" HEAD
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
